<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Bahasa Inggris - Kelas 4 SD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 25px;
    padding: 35px 30px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    text-align: center;
    color: #764ba2;
    font-size: 26px;
    margin-bottom: 10px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }

  /* ===== START SCREEN ===== */
  #startScreen { text-align: center; }
  #startScreen .emoji { font-size: 70px; margin-bottom: 15px; animation: bounce 1.5s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 15px 45px;
    font-size: 18px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(118,75,162,0.4);
    margin-top: 15px;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(118,75,162,0.6); }
  .btn:active { transform: translateY(0); }

  /* ===== QUIZ SCREEN ===== */
  #quizScreen { display: none; }

  .progress-bar {
    height: 12px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #f093fb);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 10px;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
    font-weight: bold;
  }

  .question {
    font-size: 20px;
    color: #333;
    margin-bottom: 20px;
    line-height: 1.5;
    min-height: 60px;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .option {
    background: #f5f5fa;
    border: 3px solid #e0e0e0;
    padding: 15px 20px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 17px;
    text-align: left;
    transition: 0.25s;
    color: #333;
  }
  .option:hover:not(.disabled) {
    background: #e8e8ff;
    border-color: #667eea;
    transform: translateX(5px);
  }
  .option.correct {
    background: #d4f8d4;
    border-color: #4caf50;
    color: #2e7d32;
    font-weight: bold;
  }
  .option.wrong {
    background: #ffd6d6;
    border-color: #f44336;
    color: #c62828;
    font-weight: bold;
  }
  .option.disabled { cursor: not-allowed; }

  .feedback {
    text-align: center;
    font-size: 18px;
    margin-top: 18px;
    min-height: 28px;
    font-weight: bold;
  }

  /* ===== RESULT SCREEN ===== */
  #resultScreen { display: none; text-align: center; }
  .trophy { font-size: 80px; animation: bounce 1.5s infinite; }
  .score-text {
    font-size: 48px;
    color: #764ba2;
    font-weight: bold;
    margin: 10px 0;
  }
  .message {
    font-size: 20px;
    color: #555;
    margin: 15px 0;
  }
  .stars { font-size: 40px; margin: 10px 0; }
  .detail {
    background: #f5f5fa;
    border-radius: 15px;
    padding: 15px;
    margin: 20px 0;
    font-size: 15px;
    color: #666;
  }
</style>
</head>
<body>

<div class="container">

  <!-- ====== START SCREEN ====== -->
  <div id="startScreen">
    <div class="emoji">🎓</div>
    <h1>Kuis Bahasa Inggris</h1>
    <p class="subtitle">Kelas 4 SD • My Daily Activities & Animals</p>
    <p style="color:#666; font-size:15px; line-height:1.6;">
      Ada <b>10 soal</b> pilihan ganda.<br>Pilih jawaban yang paling benar ya! 😊
    </p>
    <button class="btn" onclick="startQuiz()">🚀 Mulai Kuis</button>
  </div>

  <!-- ====== QUIZ SCREEN ====== -->
  <div id="quizScreen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="info-bar">
      <span id="questionCounter">Soal 1 dari 10</span>
      <span id="scoreDisplay">⭐ Skor: 0</span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- ====== RESULT SCREEN ====== -->
  <div id="resultScreen">
    <div class="trophy" id="trophy">🏆</div>
    <h1>Kuis Selesai!</h1>
    <div class="score-text" id="finalScore">0 / 100</div>
    <div class="stars" id="stars"></div>
    <div class="message" id="message"></div>
    <div class="detail" id="detail"></div>
    <button class="btn" onclick="restartQuiz()">🔄 Main Lagi</button>
  </div>

</div>

<script>
// ====== DATA SOAL ======
const questions = [
  { q: "What is 'kucing' in English?", options: ["Dog", "Cat", "Bird"], answer: 1 },
  { q: "I use my ______ to see.", options: ["ears", "nose", "eyes"], answer: 2 },
  { q: "We eat breakfast in the ______.", options: ["morning", "night", "evening"], answer: 0 },
  { q: "A cow gives us ______.", options: ["eggs", "milk", "honey"], answer: 1 },
  { q: "The color of the sun is ______.", options: ["blue", "yellow", "green"], answer: 1 },
  { q: "She ______ to school every day.", options: ["go", "goes", "going"], answer: 1 },
  { q: "There ______ two cats in the garden.", options: ["is", "am", "are"], answer: 2 },
  { q: "I ______ a banana every morning.", options: ["eat", "eats", "eating"], answer: 0 },
  { q: "Hello! My name is Dina. I have a pet. It is a rabbit. Its name is Snowy. Snowy has white fur and long ears. It likes to eat carrots.\n\n👉 What is Dina's pet?", options: ["A cat", "A rabbit", "A dog"], answer: 1 },
  { q: "Based on the story above:\n\n👉 What does Snowy like to eat?", options: ["Carrots", "Fish", "Bananas"], answer: 0 }
];

// ====== STATE ======
let currentIndex = 0;
let score = 0;
let answered = false;

// ====== FUNCTIONS ======
function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  currentIndex = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[currentIndex];

  // Update progress
  document.getElementById('progressFill').style.width =
    ((currentIndex) / questions.length) * 100 + '%';
  document.getElementById('questionCounter').textContent =
    `Soal ${currentIndex + 1} dari ${questions.length}`;
  document.getElementById('scoreDisplay').textContent = `⭐ Skor: ${score}`;

  // Question
  document.getElementById('questionText').innerText = q.q;

  // Options
  const optionsBox = document.getElementById('optionsBox');
  optionsBox.innerHTML = '';
  const letters = ['A', 'B', 'C'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<b>${letters[i]}.</b> ${opt}`;
    btn.onclick = () => selectAnswer(i, btn);
    optionsBox.appendChild(btn);
  });

  document.getElementById('feedback').textContent = '';
}

function selectAnswer(selected, btn) {
  if (answered) return;
  answered = true;

  const q = questions[currentIndex];
  const allOptions = document.querySelectorAll('.option');
  allOptions.forEach(o => o.classList.add('disabled'));

  const feedback = document.getElementById('feedback');

  if (selected === q.answer) {
    btn.classList.add('correct');
    score += 10;
    feedback.textContent = '✅ Benar! Hebat! 🎉';
    feedback.style.color = '#4caf50';
  } else {
    btn.classList.add('wrong');
    allOptions[q.answer].classList.add('correct');
    feedback.textContent = '❌ Belum tepat! Jawaban: ' + q.options[q.answer];
    feedback.style.color = '#f44336';
  }

  document.getElementById('scoreDisplay').textContent = `⭐ Skor: ${score}`;

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 1500);
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  const total = questions.length * 10;
  document.getElementById('finalScore').textContent = `${score} / ${total}`;

  let stars = '', message = '', trophy = '🏆';

  if (score >= 90) {
    stars = '⭐⭐⭐';
    message = 'Excellent! Kamu luar biasa! 🌟';
    trophy = '🏆';
  } else if (score >= 70) {
    stars = '⭐⭐';
    message = 'Good Job! Pertahankan ya! 👍';
    trophy = '🎖️';
  } else if (score >= 50) {
    stars = '⭐';
    message = 'Keep Trying! Ayo belajar lagi! 💪';
    trophy = '📘';
  } else {
    stars = '⭐';
    message = "Let's Study Again! Jangan menyerah! 📚";
    trophy = '📚';
  }

  document.getElementById('stars').textContent = stars;
  document.getElementById('message').textContent = message;
  document.getElementById('trophy').textContent = trophy;
  document.getElementById('detail').innerHTML =
    `Jawaban benar: <b>${score / 10}</b> dari <b>${questions.length}</b> soal`;
}

function restartQuiz() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
  currentIndex = 0;
  score = 0;
}
</script>

</body>
</html>
